backend:
  name: github
  repo: CHANGE_ME_OWNER/CHANGE_ME_REPO
  branch: main

local_backend: true
publish_mode: editorial_workflow
media_folder: "public/images/uploads"
public_folder: "/images/uploads"

site_url: "https://wtcnepal.com"
display_url: "https://wtcnepal.com"
logo_url: "/images/logo.png"

collections:
  - name: "catalog"
    label: "Catalog"
    files:
      - name: "products"
        label: "Products"
        file: "src/content/products.json"
        format: "json"
        fields:
          - label: "Products"
            name: "products"
            widget: "list"
            summary: "{{fields.name}}"
            fields:
              - { label: "ID", name: "id", widget: "string" }
              - { label: "Name", name: "name", widget: "string" }
              - label: "Division"
                name: "division"
                widget: "select"
                options:
                  - { label: "Diagnostics", value: "diagnostics" }
                  - { label: "Disinfection", value: "disinfection" }
                  - { label: "Care", value: "care" }
              - { label: "Partner", name: "partner", widget: "string" }
              - { label: "Description", name: "description", widget: "text" }
              - { label: "Image", name: "image", widget: "image", required: false }
              - { label: "Featured on homepage", name: "featured", widget: "boolean", required: false, default: false }
              - { label: "Brochure URL", name: "brochure", widget: "string", required: false }

      - name: "partners"
        label: "Partners"
        file: "src/content/partners.json"
        format: "json"
        fields:
          - label: "Partners"
            name: "partners"
            widget: "list"
            summary: "{{fields.name}}"
            fields:
              - { label: "ID", name: "id", widget: "string" }
              - { label: "Name", name: "name", widget: "string" }
              - { label: "Country", name: "country", widget: "string" }
              - { label: "Logo", name: "image", widget: "image" }
              - label: "Division"
                name: "division"
                widget: "select"
                options:
                  - { label: "Diagnostics", value: "diagnostics" }
                  - { label: "Disinfection", value: "disinfection" }
                  - { label: "Care", value: "care" }
              - { label: "Description", name: "description", widget: "text" }
              - { label: "Website", name: "website", widget: "string", required: false }

      - name: "team"
        label: "Team"
        file: "src/content/team.json"
        format: "json"
        fields:
          - label: "Team"
            name: "team"
            widget: "list"
            summary: "{{fields.name}}"
            fields:
              - { label: "ID", name: "id", widget: "string" }
              - { label: "Name", name: "name", widget: "string" }
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Bio", name: "bio", widget: "text" }
              - { label: "Email", name: "email", widget: "string" }

      - name: "serviceStations"
        label: "Service Stations"
        file: "src/content/serviceStations.json"
        format: "json"
        fields:
          - label: "Service Stations"
            name: "serviceStations"
            widget: "list"
            summary: "{{fields.city}}"
            fields:
              - { label: "ID", name: "id", widget: "string" }
              - { label: "City", name: "city", widget: "string" }
              - { label: "Address", name: "address", widget: "string" }
              - { label: "Phone", name: "phone", widget: "string" }
              - { label: "Hours", name: "hours", widget: "string" }
              - { label: "Headquarters", name: "isHQ", widget: "boolean", default: false }
              - { label: "Map Link", name: "mapLink", widget: "string" }

  - name: "news"
    label: "News"
    files:
      - name: "newsArticles"
        label: "News Articles"
        file: "src/content/news.json"
        format: "json"
        fields:
          - label: "News Articles"
            name: "newsArticles"
            widget: "list"
            summary: "{{fields.title}}"
            fields:
              - { label: "ID", name: "id", widget: "string" }
              - { label: "Slug", name: "slug", widget: "string" }
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Excerpt", name: "excerpt", widget: "text" }
              - { label: "Content", name: "content", widget: "markdown" }
              - { label: "Date", name: "date", widget: "datetime", date_format: "YYYY-MM-DD", time_format: false }
              - { label: "Reading Time", name: "readingTime", widget: "number", min: 1, value_type: "int" }
              - label: "Division"
                name: "division"
                widget: "select"
                options:
                  - { label: "General", value: "general" }
                  - { label: "Diagnostics", value: "diagnostics" }
                  - { label: "Disinfection", value: "disinfection" }
                  - { label: "Care", value: "care" }
              - { label: "Image", name: "image", widget: "image", required: false }
              - { label: "Author", name: "author", widget: "string" }
